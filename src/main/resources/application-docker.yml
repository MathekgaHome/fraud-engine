server:
  port: 8081
  servlet:
    context-path: /fraud-service

spring:
  # When we have an auth server for fraud service, we can activte this oauth2 setup, uth Jack
  # also comment out sprign security dependencies inside the pom file
  #  security:
  #    oauth2:
  #      resourceserver:
  #        jwt:
  #          issuer-uri: http://localhost:9000
  application:
    name: fraud-engine-service
  data:
    mongodb:
      uri: ${MONGO_URL:mongo_db://mongo_db:27017/fraud_db}
    redis:
      host: ${REDIS_HOST:redis-service}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
    redis:
      time-to-live: 600000
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka-service:29092}
    consumer:
      group-id: fraud-engine-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        max.request.size: 10485760
        spring.json.add.type.headers: false
        linger.ms: 20
        batch.size: 16384

storage:
  type: MINIO
  minio:
    endpoint: ${MINIO_ENDPOINT:http://minio:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:xtraleson-documents}
    active: true